name: CI

on:
  pull_request:
    branches:
      - main

jobs:
  dotnet:
    name: .NET Build & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Verify release gates
        run: >-
          ./scripts/verify-release.sh
          --install-playwright-deps
          --require-clean
          --output "$GITHUB_STEP_SUMMARY"
