name: CI

on:
  pull_request:
    branches:
      - main

jobs:
  dotnet:
    name: .NET Build & Test
    runs-on: ubuntu-latest
    # See deploy.yml's identical timeout for why: a silently-hung Playwright dependency install
    # (stalled apt-get mirror, zero output) can otherwise run for hours against GitHub's default
    # 6-hour job timeout before anyone notices.
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      # GwsBusinessSuite.App's net10.0-android target is part of the main solution, so a plain
      # `dotnet restore`/`build` here needs the maui-android workload present - GitHub's
      # ubuntu-latest image stopped bundling it (a real, external break: this same job used to
      # pass without this step). `android` alone isn't enough - the actual NETSDK1147 error names
      # `maui-android` specifically - so this installs the plain `maui` meta-workload, matching
      # clients.yml's own already-proven-working fix for its Android job.
      - run: dotnet workload install maui

      - name: Verify release gates
        run: >-
          ./scripts/verify-release.sh
          --install-playwright-deps
          --require-clean
          --output "$GITHUB_STEP_SUMMARY"
