name: Deploy to DigitalOcean

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      rehearse_rollback:
        description: "Deploy, simulate a failed readiness result, and verify automatic code rollback"
        required: true
        default: false
        type: boolean
      rehearse_migration_copy:
        description: "Round-trip the latest migration on an isolated copy of a fresh production backup"
        required: true
        default: false
        type: boolean
      measure_sentinel_latency:
        description: "Measure warmed SentinelGPT first-token and total latency against production Ollama"
        required: true
        default: false
        type: boolean

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    # Defense in depth alongside the `timeout` wrapped around the Playwright install command in
    # verify-release.sh itself: GitHub Actions jobs default to a 6-hour timeout if unset, which
    # is exactly how a single silently-hung step (observed: 30+ min with zero output, from a
    # stalled apt-get mirror) went unnoticed for hours and blocked every subsequent deploy commit
    # from shipping until someone happened to check and manually cancel it.
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      # Speed (2026-10-18): restored packages and the Playwright Chromium download are cached
      # between runs. Keys follow every project file (packages) and the Playwright package
      # version's home, so a dependency change gets a fresh cache automatically; a stale or
      # missing cache only costs time, never correctness.
      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Build.props') }}
          restore-keys: nuget-${{ runner.os }}-
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('src/GwsBusinessSuite.Infrastructure/GwsBusinessSuite.Infrastructure.csproj', 'tests/GwsBusinessSuite.Tests/GwsBusinessSuite.Tests.csproj') }}

      # --server-only: builds and tests every server/shared project (everything the test project
      # references) but not the native MAUI app, which isn't deployed here and needs the
      # maui-android workload. clients.yml builds and package-audits the app whenever it or its
      # dependencies change.
      - name: Verify release gates
        run: >-
          ./scripts/verify-release.sh
          --server-only
          --install-playwright-deps
          --require-clean
          --output "$GITHUB_STEP_SUMMARY"

  # Speed (2026-10-18): builds this commit's image ON THE DROPLET while the tests run, in its
  # own checkout (/opt/gwssuite-build) so the live checkout and running container are never
  # touched. It is only started (by the deploy job) if the tests pass; if this job fails or is
  # superseded, the deploy builds the image itself as before. The droplet keeps Docker's build
  # cache between deploys, so with the cache-friendly Dockerfile an ordinary code change rebuilds
  # only the publish step and the final copy.
  prebuild:
    name: Pre-build image on droplet
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # One image build on the droplet at a time; a newer pending build replaces an older one.
    # Never cancel a running one (the remote build would keep going without the job).
    concurrency:
      group: droplet-image-build
      cancel-in-progress: false
    steps:
      - name: Build this commit's image on the droplet
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.DO_HOST }}
          username: root
          command_timeout: 40m
          key: ${{ secrets.DO_SSH_KEY }}
          script: |
            set -e
            SHA="${{ github.sha }}"
            BUILD_DIR=/opt/gwssuite-build

            if [ ! -d "$BUILD_DIR/.git" ]; then
              git clone --quiet https://github.com/granticusmaximus/GwsBusinessSuite.git "$BUILD_DIR"
            fi
            cd "$BUILD_DIR"
            git fetch --quiet origin main
            git cat-file -e "$SHA^{commit}" 2>/dev/null || git fetch --quiet origin "$SHA"
            git checkout --quiet --force "$SHA"
            git clean -fdxq

            if docker image inspect "gwssuite-web:$SHA" >/dev/null 2>&1; then
              echo "gwssuite-web:$SHA is already built."
              exit 0
            fi

            # Keep the build cache (that's the speed) but bounded, and clear it completely if the
            # disk is getting full - a build that runs out of space fails half-way (2026-08-29).
            docker container prune -f >/dev/null 2>&1 || true
            docker image prune -f >/dev/null 2>&1 || true
            docker builder prune -f --reserved-space 8gb >/dev/null 2>&1 \
              || docker builder prune -f --keep-storage 8gb >/dev/null 2>&1 \
              || docker builder prune -f --filter until=168h >/dev/null 2>&1 || true
            docker_root=$(docker info --format '{{.DockerRootDir}}' 2>/dev/null || echo /var/lib/docker)
            avail_kb=$(df -Pk "$docker_root" 2>/dev/null | awk 'NR==2 {print $4}')
            # Unknown free space (df failed) skips the emergency prune rather than forcing it.
            if [ -n "$avail_kb" ] && [ "$avail_kb" -lt 5242880 ]; then
              echo "Less than 5 GB free: clearing the whole build cache before building."
              docker builder prune -af >/dev/null 2>&1 || true
            fi

            echo "Building gwssuite-web:$SHA..."
            DOCKER_BUILDKIT=1 docker build --quiet -t "gwssuite-web:$SHA" . >/dev/null
            echo "Built gwssuite-web:$SHA."

  deploy:
    name: Build & Deploy
    # Waits for the pre-build too, but only the tests decide: a failed or superseded pre-build
    # just means this job builds the image itself. (!cancelled(): a run cancelled by hand, or
    # superseded by a newer push, doesn't deploy - the newer run will.)
    needs: [test, prebuild]
    if: ${{ !cancelled() && needs.test.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Two deployments close together can otherwise start two "docker compose up -d --build"
    # runs against the same droplet at once.
    # Both build independently, but the container recreate step names/renames the same
    # container, so whichever finishes second hits a Docker "container name already in use"
    # conflict from the one still finishing - a real observed failure, not hypothetical. Serialize
    # deploys instead of racing them; don't cancel one mid-build/mid-swap, since a cancelled
    # Actions job doesn't reliably stop the remote SSH script it already started. GitHub retains
    # at most one pending job in a concurrency group, so a newer pending deploy replaces an older
    # pending deploy. Dispatch evidence-only rehearsals only after any desired pending push deploy
    # has started.
    concurrency:
      group: deploy-production
      cancel-in-progress: false

    steps:
      # Needed for the post-deploy verification step below (./scripts/verify-release.sh) -
      # the SSH step doesn't touch the runner's own filesystem at all, it only opens a remote
      # shell on the droplet, so nothing before this checked the repo out locally.
      - uses: actions/checkout@v7

      # No .NET setup here: the final verification runs with --deployed-only (HTTP checks only;
      # this commit was already built and tested by the test job).

      - name: SSH into droplet and deploy
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.DO_HOST }}
          username: root
          # appleboy/ssh-action's command_timeout defaults to 10m, which the remote script now
          # exceeds on a cold/no-cache Docker build alone (dotnet publish ~8m, plus apt-get and
          # Playwright browser downloads on top) - well before the health-check poll loop or a
          # rollback attempt even start. Generous ceiling, not a tight budget: covers a slow
          # from-scratch build plus a full rollback-and-reverify pass if the new release fails
          # its health check.
          command_timeout: 40m
          key: ${{ secrets.DO_SSH_KEY }}
          script: |
            set -e

            APP_DIR=/opt/gwssuite
            SHA="${{ github.sha }}"
            REHEARSE_ROLLBACK="${{ github.event_name == 'workflow_dispatch' && inputs.rehearse_rollback && 'true' || 'false' }}"
            REHEARSE_MIGRATION_COPY="${{ github.event_name == 'workflow_dispatch' && inputs.rehearse_migration_copy && 'true' || 'false' }}"
            MEASURE_SENTINEL_LATENCY="${{ github.event_name == 'workflow_dispatch' && inputs.measure_sentinel_latency && 'true' || 'false' }}"

            rehearsal_count=0
            [ "$REHEARSE_ROLLBACK" = "true" ] && rehearsal_count=$((rehearsal_count + 1))
            [ "$REHEARSE_MIGRATION_COPY" = "true" ] && rehearsal_count=$((rehearsal_count + 1))
            [ "$MEASURE_SENTINEL_LATENCY" = "true" ] && rehearsal_count=$((rehearsal_count + 1))
            if [ "$rehearsal_count" -gt 1 ]; then
              echo "Rollback, migration-copy, and SentinelGPT latency rehearsals must be dispatched separately."
              exit 1
            fi

            # First-time clone if directory doesn't exist
            if [ ! -d "$APP_DIR/.git" ]; then
              git clone https://github.com/granticusmaximus/GwsBusinessSuite.git "$APP_DIR"
            fi

            cd "$APP_DIR"

            PREVIOUS_COMMIT=$(git rev-parse HEAD)

            # Newer releases expose a bounded backup/rehearsal command. Whether the *running*
            # container recognizes it can't be reliably inferred from this worktree's checked-out
            # source (grep-the-file drifted from the live container at least once: a prior deploy
            # attempt can advance this git checkout via `git reset --hard` below without the
            # matching `docker compose up -d --build` ever completing, or `restart: always` can
            # bring the container back from a stale cached image). An unrecognized CLI arg falls
            # through to this app's normal startup path *inside the already-running container* -
            # a second Kestrel instance colliding on the same bound port, crashing the deploy.
            # So: try it and fall back on any failure instead of trusting the file on disk.
            if docker compose exec -T gwssuite dotnet GwsBusinessSuite.Web.dll --backup-create \
              && docker compose exec -T gwssuite dotnet GwsBusinessSuite.Web.dll --backup-verify; then
              :
            else
              echo "Pre-deploy backup-create/verify did not succeed on the currently running container (older release, or a fresh/incomplete deploy state); relying on its latest scheduled snapshot instead."
              # Real naming convention is gws-backup-{timestamp}.gwsbackup (DatabaseBackupService
              # .CreateBackupAsync) - this previously used the wrong glob (sentinel-backup-*.zip),
              # which never matched anything, so this safety-net check always failed. Under this
              # script's `set -e`, that meant the fallback existing specifically to avoid
              # aborting the deploy could itself abort the deploy - the one path where the check
              # is most needed (no fresh backup was just verified).
              docker compose exec -T gwssuite sh -lc 'ls /app/backups/gws-backup-*.gwsbackup >/dev/null 2>&1'
            fi

            if [ "$REHEARSE_MIGRATION_COPY" = "true" ]; then
              echo "Rehearsing the latest migration on an isolated copy of the fresh production backup."
              docker compose exec -T gwssuite dotnet GwsBusinessSuite.Web.dll --backup-migration-rehearse
            fi

            git fetch --quiet origin main
            git cat-file -e "$SHA^{commit}" 2>/dev/null || git fetch --quiet origin "$SHA"

            # Never move production backwards: when a newer commit's deploy already went out
            # (its tests finished first), this older run stops here instead of replacing it.
            if [ "$SHA" != "$PREVIOUS_COMMIT" ] && git merge-base --is-ancestor "$SHA" "$PREVIOUS_COMMIT" 2>/dev/null; then
              echo "A newer commit ($PREVIOUS_COMMIT) is already deployed; not deploying the older $SHA."
              exit 0
            fi

            # Deploy exactly the commit this run built and tested - not whatever main is now (a
            # newer push may not have finished its own tests yet).
            git checkout main
            git reset --hard "$SHA"

            # Defensive disk cleanup before building, not just after a successful one below - a
            # deploy that fails mid-build (e.g. "no space left on device" while extracting a
            # layer, observed 2026-08-29) exits under `set -e` before ever reaching the
            # post-deploy prune, so the next attempt can start already close to full. Also prunes
            # build cache, which `docker image prune` alone never touches and which is the
            # biggest disk consumer for this repeated multi-stage .NET+Playwright image - without
            # `-a`/`--volumes`, this only removes dangling images/stopped containers/unused
            # networks/build cache, never the running container's image or any data volume.
            # Keeps Docker's build cache (what makes rebuilds fast) but bounded, and clears it
            # completely when the disk is getting full. Removes stopped containers and dangling
            # images as before; never the running container's image or any data volume.
            docker container prune -f || true
            docker image prune -f || true
            docker network prune -f || true
            docker builder prune -f --reserved-space 8gb >/dev/null 2>&1 \
              || docker builder prune -f --keep-storage 8gb >/dev/null 2>&1 \
              || docker builder prune -f --filter until=168h >/dev/null 2>&1 || true
            docker_root=$(docker info --format '{{.DockerRootDir}}' 2>/dev/null || echo /var/lib/docker)
            avail_kb=$(df -Pk "$docker_root" 2>/dev/null | awk 'NR==2 {print $4}')
            # Unknown free space (df failed) skips the emergency prune rather than forcing it.
            if [ -n "$avail_kb" ] && [ "$avail_kb" -lt 5242880 ]; then
              echo "Less than 5 GB free: clearing the whole build cache."
              docker builder prune -af || true
            fi

            ROLLBACK_COMMIT="$PREVIOUS_COMMIT"
            if [ "$REHEARSE_ROLLBACK" = "true" ]; then
              # A normal push deployment may already have installed the workflow-dispatch SHA
              # before the rehearsal acquires the production concurrency lock. In that case,
              # PREVIOUS_COMMIT equals the release under test and rebuilding it proves only the
              # branch mechanics, not a real version reversal. Select the most recent earlier
              # commit that changed deployable runtime files so the rehearsal genuinely rolls
              # application code backward. Documentation/test-only commits are intentionally
              # skipped.
              ROLLBACK_COMMIT=$(git rev-list --first-parent -n 1 "${PREVIOUS_COMMIT}^" -- \
                src docker-compose.yml docker-compose.turn.yml Dockerfile)
              if [ -z "$ROLLBACK_COMMIT" ]; then
                echo "Rollback rehearsal could not find an earlier runtime-changing commit."
                exit 1
              fi
              echo "Rollback rehearsal will restore prior runtime commit $ROLLBACK_COMMIT."
            fi

            COMPOSE_FILES="-f docker-compose.yml"
            if grep -qE '^TURN_SHARED_SECRET=.{32,}$' .env 2>/dev/null && grep -qE '^TURN_URL_UDP=turn:' .env 2>/dev/null; then
              echo "TURN configuration found; deploying the coturn relay."
              COMPOSE_FILES="$COMPOSE_FILES -f docker-compose.turn.yml"
            else
              echo "TURN configuration not found; deploying with STUN/direct connectivity only."
            fi

            # The image now running becomes gwssuite-web:rollback, so a failed release can go
            # back without a rebuild.
            CURRENT_CONTAINER=$(docker compose $COMPOSE_FILES ps -q gwssuite 2>/dev/null | head -1)
            if [ -n "$CURRENT_CONTAINER" ]; then
              docker tag "$(docker inspect --format '{{.Image}}' "$CURRENT_CONTAINER")" gwssuite-web:rollback || true
            fi

            # Other services' images (Ollama, coturn); the app's own image is built, not pulled.
            docker compose $COMPOSE_FILES pull --quiet --ignore-buildable 2>/dev/null \
              || docker compose $COMPOSE_FILES pull --quiet 2>/dev/null || true

            export GWS_IMAGE_TAG="$SHA"
            if docker image inspect "gwssuite-web:$SHA" >/dev/null 2>&1; then
              echo "Starting the pre-built image gwssuite-web:$SHA."
              docker compose $COMPOSE_FILES up -d --no-build --remove-orphans
            else
              echo "No pre-built image for $SHA; building it now."
              docker compose $COMPOSE_FILES up -d --build --remove-orphans
            fi

            # Smoke test: a container reporting "up" doesn't mean the app inside it is
            # actually serving traffic (DB migration failures, a bad config value, etc.
            # all start the container and then crash or hang silently). Poll readiness
            # before declaring the deploy successful, so a broken release fails the
            # GitHub Actions run instead of going unnoticed until a user hits an error.
            echo "Waiting for the app to report ready..."
            for i in $(seq 1 24); do
              status=$(curl -s -o /dev/null -w "%{http_code}" http://localhost/health/ready || echo "000")
              # Wait until the newly built application is genuinely ready, then substitute a
              # synthetic failure so this exact production rollback branch is exercised. The
              # rollback itself selects an earlier runtime-changing commit, and its poll below
              # always uses the real endpoint and must reach HTTP 200 to count as success.
              if [ "$REHEARSE_ROLLBACK" = "true" ] && [ "$status" = "200" ]; then
                echo "Rollback rehearsal: new release is healthy; injecting a synthetic readiness failure."
                status="599"
              fi
              if [ "$status" = "200" ]; then
                echo "Health check passed (HTTP $status)."
                break
              fi
              if [ "$i" = "24" ]; then
                echo "Health check failed after deploy (last status: HTTP $status)."
                docker compose logs --tail=100 gwssuite
                echo "Rolling application code back to $ROLLBACK_COMMIT without reverting the forward-migrated data volume."
                git reset --hard "$ROLLBACK_COMMIT"
                # Fast path: the previous release's own image, restarted as it was. Not for the
                # rollback rehearsal (it rolls back to an earlier commit than the one that was
                # running), and not when the restored compose file predates image tagging.
                if [ "$ROLLBACK_COMMIT" = "$PREVIOUS_COMMIT" ] \
                    && docker image inspect gwssuite-web:rollback >/dev/null 2>&1 \
                    && grep -q 'GWS_IMAGE_TAG' docker-compose.yml; then
                  echo "Restarting the previous release's image (gwssuite-web:rollback)."
                  GWS_IMAGE_TAG=rollback docker compose $COMPOSE_FILES up -d --no-build --remove-orphans
                else
                  unset GWS_IMAGE_TAG
                  docker compose $COMPOSE_FILES up -d --build --remove-orphans
                fi
                rollback_status="000"
                for rollback_attempt in $(seq 1 24); do
                  rollback_status=$(curl -s -o /dev/null -w "%{http_code}" http://localhost/health/ready || echo "000")
                  [ "$rollback_status" = "200" ] && break
                  sleep 5
                done
                if [ "$rollback_status" != "200" ]; then
                  echo "Automatic code rollback also failed. Data was preserved; manual roll-forward is required."
                  docker compose logs --tail=100 gwssuite
                fi
                if [ "$REHEARSE_ROLLBACK" = "true" ] && [ "$rollback_status" = "200" ]; then
                  echo "Rollback rehearsal passed: runtime commit $ROLLBACK_COMMIT is ready and the data volume was preserved."
                fi
                exit 1
              fi
              sleep 5
            done

            if [ "$MEASURE_SENTINEL_LATENCY" = "true" ]; then
              echo "Measuring warmed SentinelGPT latency against the production Ollama service."
              docker compose exec -T gwssuite /usr/local/bin/measure-sentinelgpt-latency
            fi

            # Clean up: per-commit images older than this release (keeping this one and the
            # rollback copy), then dangling layers. Newer pre-built images are left alone.
            for old_tag in $(docker images gwssuite-web --filter "before=gwssuite-web:$SHA" --format '{{.Tag}}' 2>/dev/null); do
              case "$old_tag" in
                "$SHA"|rollback) ;;
                *) docker rmi "gwssuite-web:$old_tag" >/dev/null 2>&1 || true ;;
              esac
            done
            docker image prune -f

      # The SSH step above only checks http://localhost/health/ready *from inside the
      # droplet* - it can't see DNS, Cloudflare, or TLS termination, and it only proves the
      # container is up, not that any specific feature actually works (see the 2026-08
      # incident where a page could 524 from the outside while every internal health signal
      # stayed green). This runs from the Actions runner instead, over the real public
      # internet path, and checks the public site's homepage - a genuinely separate,
      # unauthenticated feature (CMS page render), not another health probe. It can't trigger
      # the SSH step's own rollback (that already completed by the time this runs), but a
      # failure here still fails the workflow and is visible immediately rather than silently.
      - name: Verify the live deployment from the outside
        run: >-
          ./scripts/verify-release.sh
          --deployed-only
          --base-url https://admin.gwsapp.net
          --public-base-url https://grantwatson.dev
          --output "$GITHUB_STEP_SUMMARY"
