<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#141210" />
    <title>Offline · GWS Business Suite</title>
    <style>
        /* The service worker (sw.js) shows this when a page can't be reached. Self-contained: it's
           served from the worker's cache with no network. Colours are app.css's tokens. */
        :root {
            --bg: #ffffff;
            --panel: #f5f5f4;
            --border: #e7e5e4;
            --text: #1c1917;
            --soft: #57534e;
            --accent: #d97706;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #141210;
                --panel: #1c1917;
                --border: #292524;
                --text: #fafaf9;
                --soft: #a8a29e;
                --accent: #f59e0b;
            }
        }
        * { box-sizing: border-box; }
        html, body { height: 100%; }
        body {
            margin: 0;
            display: grid;
            place-items: center;
            padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom));
            background: var(--bg);
            color: var(--text);
            font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif;
        }
        main {
            width: 100%;
            max-width: 26rem;
            padding: 1.75rem 1.5rem;
            border: 1px solid var(--border);
            border-radius: 12px;
            background: var(--panel);
            text-align: center;
        }
        img { width: 64px; height: 64px; border-radius: 14px; }
        h1 { margin: 1rem 0 .5rem; font-size: 1.25rem; }
        p { margin: 0 0 1.25rem; color: var(--soft); }
        a {
            display: inline-block;
            min-height: 44px;
            padding: .65rem 1.4rem;
            border-radius: 8px;
            background: var(--accent);
            color: #1c1917;
            font-weight: 600;
            text-decoration: none;
        }
        a:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }
    </style>
</head>
<body>
    <main>
        <img src="/img/app-icons/icon-192.png" alt="" />
        <h1>You're offline</h1>
        <p>GWS Business Suite runs on its server, so it needs a connection. This page tries again by itself when you're back online.</p>
        <a href="/admin">Try again</a>
    </main>
    <script src="/js/offline-retry.js"></script>
</body>
</html>
