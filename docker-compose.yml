services:
  gwssuite:
    build: .
    ports:
      # The origin is private to the droplet. Cloudflared/reverse proxy reaches it over
      # loopback; internet clients must use the HTTPS hostname and cannot bypass TLS.
      - "127.0.0.1:80:8080"
    env_file:
      - path: .env
        required: false
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      # Admin pages format times with ToLocalTime(), which follows the container's zone - UTC
      # unless set. Override with TZ=... in .env if the business moves.
      TZ: ${TZ:-America/New_York}
      # Point the app at the Ollama container on the internal Docker network.
      # These override the localhost defaults in appsettings.json.
      ContentStudio__BaseUrl: http://ollama:11434
      ExternalServices__OllamaBaseUrl: http://ollama:11434
      # Light server-AI mode: this droplet only runs short summaries on a small model. Content
      # Studio drafts/revisions run on the Ollama of the computer the browser is on, and
      # SentinelGPT chat/agents run in the Mac app. Remove to restore full server-side AI.
      ServerAi__Mode: Light
      # Email (form-submission notifications, Growth reports, bookings, campaigns, the client
      # portal) all fall back to ONE shared SMTP section - set it once in the gitignored .env:
      #   Smtp__Host=smtp.yourprovider.com   Smtp__Port=587   Smtp__Security=StartTls
      #   Smtp__Username=...   Smtp__Password=...   Smtp__FromAddress=noreply@grantwatson.dev
      # A feature's own section (e.g. GrowthReportEmail__Host) still overrides it when set; with
      # no SMTP at all, mail goes via the Google account connected under Automation > Credentials.
      # Admin > Settings > Email shows the live route and sends a test.
      # The grantwatson.dev /contact form refuses ALL submissions until Cloudflare Turnstile keys
      # are set (docs/CONTACT_FORM_PROTECTION.md). The public site key ships in appsettings.json;
      # put the secret in .env as Turnstile__SecretKey - not here: an empty-default entry here
      # would override .env.
      # Optional live internet research for SentinelGPT. Keep the actual key in the
      # gitignored .env file as OLLAMA_WEB_API_KEY, never in this Compose file.
      OllamaWeb__ApiKey: ${OLLAMA_WEB_API_KEY:-}
      # Optional: lets the native macOS app skip the browser's mandatory MFA challenge via
      # /auth/device-login. Absent/empty disables that endpoint entirely (fails closed). Keep the
      # actual secret in the gitignored .env file as NATIVE_APP_DEVICE_SECRET, never here.
      NativeApp__DeviceSecret: ${NATIVE_APP_DEVICE_SECRET:-}
      # Optional local-only country/region enrichment. The request IP is discarded
      # after lookup; only coarse geography is persisted.
      AnalyticsGeoIp__DatabasePath: ${ANALYTICS_GEOIP_DATABASE_PATH:-/app/data/GeoLite2-City.mmdb}
      # TURN stays disabled when these values are absent. When the optional `turn`
      # profile is enabled, the app derives short-lived browser credentials from the
      # same secret coturn uses; the shared secret itself is never sent to clients.
      LiveShow__Ice__Turn__Urls__0: ${TURN_URL_UDP:-}
      LiveShow__Ice__Turn__Urls__1: ${TURN_URL_TCP:-}
      LiveShow__Ice__Turn__SharedSecret: ${TURN_SHARED_SECRET:-}
      Backups__Enabled: "true"
      # Optional externally escrowed key. When absent, GWS creates a mode-0600 key in the
      # data volume; copy that key into a separate password manager before relying on backups.
      Backups__EncryptionKey: ${BACKUP_ENCRYPTION_KEY:-}
      # Overwatch Grid's camera sources - all three free to self-register for (see
      # CameraIntelOptions.cs for signup links). GDOT and Datumfeed's anonymous tier already work
      # with none of these set; WSDOT/Windy need their own key to show any cameras at all, and a
      # Datumfeed key just raises its anonymous rate limit. Keep the actual values in the
      # gitignored .env file, never in this Compose file.
      CameraIntel__WsdotAccessCode: ${CAMERA_INTEL_WSDOT_ACCESS_CODE:-}
      CameraIntel__WindyApiKey: ${CAMERA_INTEL_WINDY_API_KEY:-}
      CameraIntel__DatumfeedApiKey: ${CAMERA_INTEL_DATUMFEED_API_KEY:-}
      # Mapillary's worldwide street-level imagery - free but requires this self-registered
      # token (mapillary.com/developer); KartaView needs no key at all, so it has no entry here.
      CameraIntel__MapillaryAccessToken: ${CAMERA_INTEL_MAPILLARY_ACCESS_TOKEN:-}
      # Threat Intelligence page's optional keys (see ThreatIntelOptions.cs for signup links) -
      # RDAP and the defend.network feed need no key at all; only OTX pulses and Focsec's IP
      # reputation classification go blank until their own free key is added.
      ThreatIntel__OtxApiKey: ${THREAT_INTEL_OTX_API_KEY:-}
      ThreatIntel__FocsecApiKey: ${THREAT_INTEL_FOCSEC_API_KEY:-}
    restart: always
    volumes:
      - gwssuite-data:/app/data
      - gwssuite-backups:/app/backups
      # Read-only: lets the Docker Health admin page inspect (never control) sibling
      # containers on this droplet. Every container here belongs to this app's own stack.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    healthcheck:
      # CI/deploy.yml already poll /health/live externally after a deploy; this tells
      # Compose itself (docker compose ps, restart policies, any future depends_on
      # referencing this service) the same thing. curl is already installed in the final
      # image stage (Dockerfile). Short timings - this app boots in seconds, not minutes.
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      ollama:
        condition: service_healthy

  ollama:
    image: ollama/ollama:latest
    # Keep a model load from exhausting the droplet and dropping the Cloudflare
    # tunnel. The current 8 GiB host cannot fit gemma4 alongside the web app.
    mem_limit: 5g
    environment:
      # Light model set: llama3.2 (~2 GB) for summaries plus embeddinggemma (~0.6 GB) for
      # search. The full desktop set in required-models.txt is for the Mac app/SentinelCLI.
      OLLAMA_MODEL_MANIFEST: /ollama-profiles/server-models.txt
      # Same SentinelGPT system prompt, rebuilt on the small model with a smaller context
      # window (the KV cache for the desktop profile's 16k context alone costs gigabytes).
      SENTINELGPT_BASE_MODEL: llama3.2
      SENTINELGPT_NUM_CTX: "8192"
      # Frees the disk held by the old heavy models and stops anything that discovers
      # installed models dynamically from loading one.
      OLLAMA_PRUNE_UNLISTED: "true"
      # Both small models fit together, so summaries and search indexing no longer
      # evict each other and reload from disk on every switch.
      OLLAMA_MAX_LOADED_MODELS: "2"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_QUEUE: "16"
      OLLAMA_KEEP_ALIVE: "30m"
    restart: always
    volumes:
      # Models are stored on the droplet SSD so they survive container restarts
      # and image updates. Only the first-ever startup downloads the full files.
      - ollama-models:/root/.ollama
      # Mount the init script from the repo into the container read-only.
      - ./scripts/ollama-init.sh:/scripts/ollama-init.sh:ro
      # Version-controlled behavioral profile for the private SentinelGPT model.
      - ./ollama:/ollama-profiles:ro
    entrypoint: ["/bin/sh", "/scripts/ollama-init.sh"]
    healthcheck:
      # Passes as soon as the Ollama server is accepting requests —
      # before model pulls complete, so the app can start in parallel.
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s

volumes:
  gwssuite-data:
  gwssuite-backups:
  ollama-models:
